plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

['run/client1', 'run/client2', 'run/server'].each { project.file(it).mkdirs() }

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

var generatePillTexture = tasks.register("generatePillTexture") {
    var outputDir = layout.buildDirectory.dir("generated/pillTexture")
    outputs.dir(outputDir)
    doLast {
        var textureFile = outputDir.get().file("assets/njw_after_the_end/textures/item/villager_pill.png").asFile
        textureFile.parentFile.mkdirs()
        textureFile.bytes = java.util.Base64.decoder.decode("")
    }
}
sourceSets.main.resources.srcDir generatePillTexture
neoForge.ideSyncTask generatePillTexture

repositories {
    mavenCentral()
    ivy {
        name = 'JustDragonEggsReleases'
        url = uri('https://github.com/najaewon-modding/just-dragon-eggs/releases/download')
        patternLayout {
            artifact 'v[revision]/[artifact]-[revision].[ext]'
        }
        metadataSources {
            artifact()
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run/client1')
            programArguments.addAll '--username', 'DevPlayer1'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        client2 {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll '--username', 'DevPlayer2'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "net.njw:njw_just_dragon_eggs:${just_dragon_eggs_version}@jar"
    localRuntime "net.njw:njw_just_dragon_eggs:${just_dragon_eggs_version}@jar"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            just_dragon_eggs_version : just_dragon_eggs_version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('runServer') {
    standardInput = System.in
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
