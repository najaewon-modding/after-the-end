name: Regenerate Basecamp Variants V8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-basecamp-variants-v8.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebalance perimeter point colors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/generate_basecamp_structure.py')
          text = path.read_text(encoding='utf-8')

          point_colors = {
              'basecamp_red': 'minecraft:yellow_glazed_terracotta',
              'basecamp_orange': 'minecraft:white_glazed_terracotta',
              'basecamp_yellow': 'minecraft:orange_glazed_terracotta',
              'basecamp_lime': 'minecraft:yellow_glazed_terracotta',
              'basecamp_green': 'minecraft:cyan_glazed_terracotta',
              'basecamp_cyan': 'minecraft:white_glazed_terracotta',
              'basecamp_light_blue': 'minecraft:cyan_glazed_terracotta',
              'basecamp_blue': 'minecraft:light_blue_glazed_terracotta',
              'basecamp_purple': 'minecraft:light_blue_glazed_terracotta',
              'basecamp_white': 'minecraft:blue_glazed_terracotta',
          }

          for name, color in point_colors.items():
              pattern = rf'("{name}": \{{[^\n]*?"point": ")[^"]+("[^\n]*\}})'
              text, count = re.subn(pattern, rf'\1{color}\2', text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update point color for {name}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Generate Basecamp variants
        run: python tools/generate_basecamp_structure.py

      - name: Validate point palettes and structures
        run: |
          python - <<'PY'
          import gzip
          import importlib.util
          import os

          spec = importlib.util.spec_from_file_location('basecamp_gen', 'tools/generate_basecamp_structure.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          expected = {
              'basecamp_red': 'minecraft:yellow_glazed_terracotta',
              'basecamp_orange': 'minecraft:white_glazed_terracotta',
              'basecamp_yellow': 'minecraft:orange_glazed_terracotta',
              'basecamp_lime': 'minecraft:yellow_glazed_terracotta',
              'basecamp_green': 'minecraft:cyan_glazed_terracotta',
              'basecamp_cyan': 'minecraft:white_glazed_terracotta',
              'basecamp_light_blue': 'minecraft:cyan_glazed_terracotta',
              'basecamp_blue': 'minecraft:light_blue_glazed_terracotta',
              'basecamp_purple': 'minecraft:light_blue_glazed_terracotta',
              'basecamp_white': 'minecraft:blue_glazed_terracotta',
          }

          root = 'src/main/resources/data/njw_after_the_end/structure/basecamp'
          for name, color in expected.items():
              cfg = mod.VARIANTS[name]
              assert cfg['point'] == color, (name, cfg['point'], color)
              path = os.path.join(root, name + '.nbt')
              assert os.path.isfile(path), path
              with gzip.open(path, 'rb') as f:
                  raw = f.read()
              token = color.removeprefix('minecraft:').encode()
              assert token in raw, (name, token)
              for required in (b'DataVersion', b'palette', b'blocks', b'entities'):
                  assert required in raw, (name, required)

          with gzip.open(os.path.join(root, 'basecamp_mossy.nbt'), 'rb') as f:
              mossy = f.read()
          for token in (b'mossy_stone_bricks', b'cracked_stone_bricks', b'cobweb'):
              assert token in mossy, token
          PY

      - name: Commit generated variants
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_basecamp_structure.py src/main/resources/data/njw_after_the_end/structure/basecamp/*.nbt
          git rm .github/workflows/regenerate-basecamp-variants-v8.yml
          git commit -m 'feat: harmonize basecamp rune point colors'
          git push
