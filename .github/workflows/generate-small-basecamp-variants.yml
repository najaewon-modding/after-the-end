name: Generate Small Basecamp Variants

on:
  push:
    paths:
      - ".github/workflows/generate-small-basecamp-variants.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate compact structures
        run: python tools/generate_small_basecamp_structure.py

      - name: Validate compact structures
        run: |
          python - <<'PY'
          import gzip
          import os
          import struct

          root = "src/main/resources/data/njw_after_the_end/structure/basecamp"
          names = [
              "basecamp_small_01",
              "basecamp_small_mossy",
              "basecamp_small_cyan",
              "basecamp_small_green",
              "basecamp_small_white",
          ]
          point_tokens = {
              "basecamp_small_01": b"yellow_glazed_terracotta",
              "basecamp_small_mossy": b"lime_glazed_terracotta",
              "basecamp_small_cyan": b"white_glazed_terracotta",
              "basecamp_small_green": b"lime_glazed_terracotta",
              "basecamp_small_white": b"blue_glazed_terracotta",
          }
          size_tag = b"\x09\x00\x04size\x03" + struct.pack(">i", 3) + struct.pack(">iii", 11, 7, 11)
          for name in names:
              path = os.path.join(root, name + ".nbt")
              assert os.path.exists(path), path
              with gzip.open(path, "rb") as f:
                  raw = f.read()
              assert raw[:3] == b"\x0a\x00\x00", name
              assert size_tag in raw, f"wrong size: {name}"
              assert b"palette" in raw and b"blocks" in raw and b"entities" in raw, name
              assert point_tokens[name] in raw, f"missing point palette: {name}"
          with gzip.open(os.path.join(root, "basecamp_small_mossy.nbt"), "rb") as f:
              mossy = f.read()
          for token in (b"cracked_stone_bricks", b"mossy_stone_bricks", b"cobweb"):
              assert token in mossy, token
          print("Validated five 11x7x11 compact Basecamp templates")
          PY

      - name: Commit generated structures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_small_*.nbt
          git rm .github/workflows/generate-small-basecamp-variants.yml
          git commit -m "feat: add compact basecamp variants"
          git push
