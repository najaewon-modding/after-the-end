name: Apply Basecamp Fallback Locate

on:
  push:
    paths:
      - ".github/workflows/apply-basecamp-fallback-locate.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - name: Apply patch
        run: python tools/patch_basecamp_fallback_locate.py
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/net/njw/aftertheend/AfterTheEnd.java src/main/java/net/njw/aftertheend/city/basecamp/BasecampPlacementService.java src/main/java/net/njw/aftertheend/city/basecamp/BasecampCommand.java
          git rm tools/patch_basecamp_fallback_locate.py
          git rm .github/workflows/apply-basecamp-fallback-locate.yml
          git rm .github/workflows/fix-basecamp-placement-locate.yml
          git commit -m "fix: guarantee basecamp placement and add locate command"
          git push
