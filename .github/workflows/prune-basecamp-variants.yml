name: Prune Basecamp Variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-basecamp-variants.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep selected Basecamp variants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/generate_basecamp_structure.py')
          text = path.read_text(encoding='utf-8')

          variants = '''VARIANTS = {
              "basecamp_01": {**STONE, "style": "classic", "outer": "minecraft:light_gray_glazed_terracotta", "primary": "minecraft:yellow_glazed_terracotta", "secondary": "minecraft:blue_glazed_terracotta", "core": "minecraft:white_glazed_terracotta", "rune": "minecraft:yellow_glazed_terracotta", "point": "minecraft:yellow_glazed_terracotta", "aged_level": 0},
              "basecamp_mossy": {**STONE, "style": "classic", "outer": "minecraft:light_gray_glazed_terracotta", "primary": "minecraft:green_glazed_terracotta", "secondary": "minecraft:cyan_glazed_terracotta", "core": "minecraft:white_glazed_terracotta", "rune": "minecraft:lime_glazed_terracotta", "point": "minecraft:lime_glazed_terracotta", "aged_level": 2},
              "basecamp_cyan": {**STONE, "style": "classic_cyan", "outer": "minecraft:cyan_glazed_terracotta", "primary": "minecraft:light_blue_glazed_terracotta", "secondary": "minecraft:white_glazed_terracotta", "core": "minecraft:white_glazed_terracotta", "rune": "minecraft:cyan_glazed_terracotta", "point": "minecraft:white_glazed_terracotta", "aged_level": 0},
              "basecamp_green": {**STONE, "style": "classic_green", "outer": "minecraft:green_glazed_terracotta", "primary": "minecraft:lime_glazed_terracotta", "secondary": "minecraft:cyan_glazed_terracotta", "core": "minecraft:white_glazed_terracotta", "rune": "minecraft:green_glazed_terracotta", "point": "minecraft:lime_glazed_terracotta", "aged_level": 0},
              "basecamp_white": {**STONE, "style": "classic_white", "outer": "minecraft:white_glazed_terracotta", "primary": "minecraft:light_gray_glazed_terracotta", "secondary": "minecraft:blue_glazed_terracotta", "core": "minecraft:white_glazed_terracotta", "rune": "minecraft:light_blue_glazed_terracotta", "point": "minecraft:blue_glazed_terracotta", "aged_level": 0},
          }'''
          text, count = re.subn(r'VARIANTS = \{.*?\n\}', variants, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one VARIANTS block, replaced {count}')

          motifs = '''CLASSIC_MOTIFS = {
              "classic_green": (-4.3, 3.6, 3.2, 2.15, 2.70, None),
              "classic_cyan": (-4.1, 4.1, 3.0, 2.25, 2.85, (0, -2)),
              "classic_white": (-4.0, 3.6, 3.1, 2.20, 2.80, (0, -3)),
          }'''
          text, count = re.subn(r'CLASSIC_MOTIFS = \{.*?\n\}', motifs, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one CLASSIC_MOTIFS block, replaced {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove discarded variants
        run: |
          rm -f src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_red.nbt
          rm -f src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_orange.nbt
          rm -f src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_yellow.nbt
          rm -f src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_lime.nbt
          rm -f src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_light_blue.nbt
          rm -f src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_blue.nbt
          rm -f src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_purple.nbt

      - name: Generate selected variants
        run: python tools/generate_basecamp_structure.py

      - name: Validate selected variants
        run: |
          python - <<'PY'
          import gzip
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('basecamp_gen', 'tools/generate_basecamp_structure.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          expected = {'basecamp_01', 'basecamp_mossy', 'basecamp_cyan', 'basecamp_green', 'basecamp_white'}
          assert set(mod.VARIANTS) == expected, set(mod.VARIANTS)
          assert mod.VARIANTS['basecamp_cyan']['point'] == 'minecraft:white_glazed_terracotta'
          assert mod.VARIANTS['basecamp_green']['point'] == 'minecraft:lime_glazed_terracotta'
          assert mod.VARIANTS['basecamp_white']['point'] == 'minecraft:blue_glazed_terracotta'

          root = Path('src/main/resources/data/njw_after_the_end/structure/basecamp')
          actual = {p.stem for p in root.glob('*.nbt')}
          assert actual == expected, (actual, expected)

          for name in expected:
              with gzip.open(root / f'{name}.nbt', 'rb') as f:
                  raw = f.read()
              for token in (b'DataVersion', b'palette', b'blocks', b'entities'):
                  assert token in raw, (name, token)

          with gzip.open(root / 'basecamp_cyan.nbt', 'rb') as f:
              assert b'white_glazed_terracotta' in f.read()
          with gzip.open(root / 'basecamp_green.nbt', 'rb') as f:
              assert b'lime_glazed_terracotta' in f.read()
          with gzip.open(root / 'basecamp_mossy.nbt', 'rb') as f:
              mossy = f.read()
          for token in (b'mossy_stone_bricks', b'cracked_stone_bricks', b'cobweb'):
              assert token in mossy, token
          PY

      - name: Commit selected variants
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tools/generate_basecamp_structure.py src/main/resources/data/njw_after_the_end/structure/basecamp .github/workflows/prune-basecamp-variants.yml
          git rm .github/workflows/prune-basecamp-variants.yml
          git commit -m 'feat: finalize basecamp variant set'
          git push
