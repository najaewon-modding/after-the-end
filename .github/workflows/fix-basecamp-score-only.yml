name: Fix Basecamp Score-Only Candidates

on:
  push:
    paths:
      - ".github/workflows/fix-basecamp-score-only.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - name: Apply fix
        run: python tools/patch_basecamp_no_usable.py
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/net/njw/aftertheend/city/basecamp/BasecampPlacementPlanner.java
          git rm tools/patch_basecamp_no_usable.py
          git rm .github/workflows/fix-basecamp-score-only.yml
          git commit -m "fix: keep all FPS basecamp candidates scored"
          git push
