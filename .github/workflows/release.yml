name: Release

on:
  push:
    branches: [main]
    paths:
      - gradle.properties
      - .github/workflows/release.yml
      - .github/release-notes/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: after-the-end-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: |
          ./gradlew build
          ./gradlew runGameTestServer

      - name: Read release info
        id: release_info
        shell: bash
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read mod_version from gradle.properties" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=build/libs/njw_after_the_end-$VERSION.jar" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ -(alpha|beta|rc)\. ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_info.outputs.version }}
          TAG: ${{ steps.release_info.outputs.tag }}
          ASSET: ${{ steps.release_info.outputs.asset }}
          PRERELEASE: ${{ steps.release_info.outputs.prerelease }}
        shell: bash
        run: |
          if [ ! -f "$ASSET" ]; then
            echo "Release asset not found: $ASSET" >&2
            exit 1
          fi

          NOTES=".github/release-notes/$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$(mktemp)"
            printf '# After the End %s\n' "$VERSION" > "$NOTES"
          fi

          TITLE="After the End $VERSION"
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+)-mc ]]; then
            TITLE="After the End ${BASH_REMATCH[1]} Beta ${BASH_REMATCH[2]}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            EXTRA_ARGS=()
            if [ "$PRERELEASE" = "true" ]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              "${EXTRA_ARGS[@]}"
          fi
