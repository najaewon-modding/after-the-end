name: Regenerate Basecamp V3

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_basecamp_structure.py'
      - '.github/workflows/regenerate-basecamp-v3.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Basecamp NBT
        run: python tools/generate_basecamp_structure.py

      - name: Validate generated structure
        run: |
          python - <<'PY'
          import gzip, os
          path = 'src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_01.nbt'
          assert os.path.isfile(path), path
          with gzip.open(path, 'rb') as f:
              raw = f.read()
          assert raw[:3] == b'\x0a\x00\x00', raw[:3]
          for token in (b'DataVersion', b'palette', b'blocks', b'entities', b'light_gray_glazed_terracotta', b'yellow_glazed_terracotta', b'blue_glazed_terracotta', b'chiseled_stone_bricks', b'stone_brick_wall'):
              assert token in raw, token
          print(f'Validated {path}: {os.path.getsize(path)} compressed bytes, {len(raw)} raw bytes')
          PY

      - name: Commit regenerated NBT
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/data/njw_after_the_end/structure/basecamp/basecamp_01.nbt
          git rm .github/workflows/regenerate-basecamp-v3.yml
          git commit -m 'feat: refine basecamp altar silhouette'
          git push
