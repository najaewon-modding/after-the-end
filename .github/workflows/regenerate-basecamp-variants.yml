name: Regenerate Basecamp Variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-basecamp-variants.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Basecamp variants
        run: python tools/generate_basecamp_structure.py

      - name: Validate generated structures
        run: |
          python - <<'PY'
          import gzip, os
          root = 'src/main/resources/data/njw_after_the_end/structure/basecamp'
          expected = {
              'basecamp_01.nbt': (b'stone_bricks', b'yellow_glazed_terracotta', b'blue_glazed_terracotta'),
              'basecamp_mossy.nbt': (b'mossy_stone_bricks', b'green_glazed_terracotta', b'lime_glazed_terracotta'),
              'basecamp_deepslate.nbt': (b'cobbled_deepslate', b'polished_deepslate', b'purple_glazed_terracotta'),
              'basecamp_red.nbt': (b'red_glazed_terracotta', b'orange_glazed_terracotta'),
              'basecamp_green.nbt': (b'green_glazed_terracotta', b'lime_glazed_terracotta'),
              'basecamp_purple.nbt': (b'purple_glazed_terracotta', b'magenta_glazed_terracotta'),
          }
          for filename, tokens in expected.items():
              path = os.path.join(root, filename)
              assert os.path.isfile(path), path
              with gzip.open(path, 'rb') as f: raw = f.read()
              assert raw[:3] == b'\x0a\x00\x00', (filename, raw[:3])
              for token in (b'DataVersion', b'palette', b'blocks', b'entities', *tokens): assert token in raw, (filename, token)
              print(filename, os.path.getsize(path), 'bytes')
          PY

      - name: Commit generated variants
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/data/njw_after_the_end/structure/basecamp/*.nbt
          git rm .github/workflows/regenerate-basecamp-variants.yml
          git commit -m 'feat: add basecamp structure variants'
          git push
