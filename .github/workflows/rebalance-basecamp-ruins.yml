name: Rebalance Basecamp Ruins

on:
  push:
    paths:
      - ".github/workflows/rebalance-basecamp-ruins.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebalance ruin damage
        run: |
          python - <<'PY'
          from pathlib import Path

          large_path = Path("tools/generate_basecamp_structure.py")
          large = large_path.read_text()
          start = large.index("def add_ruin_decay(cfg):")
          end = large.index("\ndef generate(name, cfg):", start)
          large_fn = '''def add_ruin_decay(cfg):
              if cfg["aged_level"] < 2: return

              # Keep the restrained ruin silhouette from the earlier pass, but
              # break the top circular altar more decisively so the damage reads
              # from normal gameplay height and from above.
              missing = [
                  # Inner stair ring: restrained damage on the lower tier.
                  (13, 1, 6), (14, 1, 6), (20, 1, 12), (20, 1, 13),
                  (18, 1, 18), (8, 1, 18),

                  # Top altar (y=2): four asymmetric chunks removed from the
                  # circular glazed edge. The lower tiers remain mostly intact.
                  (11, 2, 7), (12, 2, 7), (13, 2, 7), (14, 2, 7), (15, 2, 7),
                  (19, 2, 11), (19, 2, 12), (19, 2, 13), (19, 2, 14),
                  (17, 2, 18), (16, 2, 18), (15, 2, 19),
                  (8, 2, 17), (7, 2, 15), (7, 2, 14),

                  # Outer platform and approaches: return to the lighter pass.
                  (13, 1, 3), (14, 1, 3), (22, 1, 17), (5, 1, 7), (3, 1, 14),
                  (14, 1, 1), (12, 1, 25),

                  # Obelisks: visibly aged, but no longer heavily demolished.
                  (4, 7, 4), (4, 6, 4), (5, 4, 4),
                  (22, 7, 22), (22, 4, 21), (21, 2, 4), (4, 4, 21),
              ]
              for pos in missing:
                  blocks.pop(pos, None)

              # Cracks cluster immediately inside the missing top arcs and at
              # the older fractures elsewhere in the structure.
              cracked = [
                  (10, 2, 8), (11, 2, 8), (16, 2, 8),
                  (18, 2, 10), (18, 2, 15),
                  (17, 2, 17), (14, 2, 18), (9, 2, 16), (8, 2, 15),
                  (12, 1, 6), (15, 1, 6), (20, 1, 14), (17, 1, 18), (9, 1, 18),
                  (12, 1, 4), (15, 1, 4), (21, 1, 17), (6, 1, 7), (4, 1, 15),
                  (3, 1, 4), (4, 2, 3), (5, 3, 4),
                  (21, 1, 22), (22, 2, 21), (21, 3, 22),
                  (3, 2, 22), (4, 3, 21), (22, 2, 5),
              ]
              for pos in cracked:
                  if pos in blocks: put(*pos, cfg["aged"])

              mossy = [
                  (10, 1, 5), (9, 1, 6), (7, 1, 9), (6, 1, 10),
                  (5, 1, 18), (6, 1, 19), (8, 1, 21),
                  (3, 1, 5), (3, 2, 4), (4, 3, 3),
                  (21, 1, 21), (22, 1, 20), (23, 2, 22),
              ]
              for pos in mossy:
                  if pos in blocks: put(*pos, cfg["moss"])

              webs = [
                  (12, 3, 7), (14, 3, 7), (19, 3, 13), (16, 3, 18), (8, 3, 16),
                  (4, 6, 4), (5, 4, 5), (21, 4, 5),
                  (5, 4, 21), (21, 4, 21), (22, 7, 21),
              ]
              for pos in webs:
                  if pos not in blocks: put(*pos, "minecraft:cobweb")
          '''
          large_fn = "\n".join(line[14:] if line.startswith("              ") else line for line in large_fn.splitlines())
          large_path.write_text(large[:start] + large_fn + large[end:])

          small_path = Path("tools/generate_small_basecamp_structure.py")
          small = small_path.read_text()
          start = small.index("def add_ruin_decay(cfg):")
          end = small.index("\nTAG_END", start)
          small_fn = '''def add_ruin_decay(cfg):
              if not cfg["decayed"]: return

              # Restore the lighter overall ruin, then concentrate the extra
              # damage on the top circular altar where it is visually obvious.
              missing = [
                  # Top altar: three contiguous bites through the circular edge.
                  (4, 2, 2), (5, 2, 2), (6, 2, 2),
                  (8, 2, 4), (8, 2, 5), (8, 2, 6),
                  (3, 2, 7), (4, 2, 8),

                  # Lower platform / approaches: restrained earlier damage.
                  (5, 1, 1), (9, 1, 6), (2, 1, 7),

                  # Obelisks: earlier moderate height loss.
                  (1, 5, 1), (1, 4, 1), (9, 5, 9),
              ]
              for pos in missing: blocks.pop(pos, None)

              cracked = [
                  # Broken top-edge neighbors.
                  (3, 2, 3), (7, 2, 3), (7, 2, 4), (7, 2, 7), (3, 2, 6),
                  # Earlier restrained fracture accents.
                  (4, 1, 1), (6, 1, 1), (8, 1, 6), (2, 1, 6),
                  (1, 3, 1), (2, 1, 1), (8, 1, 9), (9, 3, 9),
              ]
              for pos in cracked:
                  if pos in blocks: put(*pos, cfg["aged"])

              mossy = [(2, 1, 2), (3, 1, 2), (2, 1, 8), (3, 1, 8), (8, 1, 8), (7, 1, 8), (1, 2, 9)]
              for pos in mossy:
                  if pos in blocks: put(*pos, cfg["moss"])

              webs = [(1, 4, 1), (2, 3, 1), (8, 3, 9), (5, 3, 2), (8, 3, 5), (4, 3, 8)]
              for pos in webs:
                  if pos not in blocks: put(*pos, "minecraft:cobweb")
          '''
          small_fn = "\n".join(line[14:] if line.startswith("              ") else line for line in small_fn.splitlines())
          small_path.write_text(small[:start] + small_fn + small[end:])
          PY

      - name: Generate structures
        run: |
          python tools/generate_basecamp_structure.py
          python tools/generate_small_basecamp_structure.py

      - name: Validate focused top-layer damage
        run: |
          python - <<'PY'
          import gzip
          import os
          import re

          root = "src/main/resources/data/njw_after_the_end/structure/basecamp"
          files = sorted(f for f in os.listdir(root) if f.endswith(".nbt"))
          assert len(files) == 20, len(files)

          ruined = [f for f in files if f.endswith("_ruined.nbt") or f in {"basecamp_mossy.nbt", "basecamp_small_mossy.nbt"}]
          assert len(ruined) == 10, ruined
          for name in ruined:
              with gzip.open(os.path.join(root, name), "rb") as f:
                  raw = f.read()
              for token in (b"cracked_stone_bricks", b"mossy_stone_bricks", b"cobweb"):
                  assert token in raw, (name, token)

          large = open("tools/generate_basecamp_structure.py").read()
          small = open("tools/generate_small_basecamp_structure.py").read()
          # Top layer must have clearly more explicit removals than the earlier pass.
          large_fn = large[large.index("def add_ruin_decay"):large.index("def generate", large.index("def add_ruin_decay"))]
          small_fn = small[small.index("def add_ruin_decay"):small.index("TAG_END", small.index("def add_ruin_decay"))]
          assert large_fn.count(", 2,") >= 20, large_fn.count(", 2,")
          assert small_fn.count(", 2,") >= 10, small_fn.count(", 2,")
          print("Validated 20 templates with focused top-layer ruin damage")
          PY

      - name: Commit rebalanced ruins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_basecamp_structure.py tools/generate_small_basecamp_structure.py src/main/resources/data/njw_after_the_end/structure/basecamp/*.nbt
          git rm .github/workflows/rebalance-basecamp-ruins.yml
          git commit -m "feat: focus basecamp ruin damage on upper altar"
          git push
