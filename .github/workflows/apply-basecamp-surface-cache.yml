name: Apply Basecamp Surface Cache

on:
  push:
    paths:
      - '.github/workflows/apply-basecamp-surface-cache.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply surface sample cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/net/njw/aftertheend/city/basecamp/BasecampPlacementPlanner.java')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import java.util.HashSet;\n',
              'import java.util.HashMap;\nimport java.util.HashSet;\n'
          )
          replace_once(
              'import java.util.Locale;\n',
              'import java.util.Locale;\nimport java.util.Map;\n'
          )
          replace_once(
              '        SearchBounds smallBounds = searchBounds(region, SMALL);\n'
              '        SearchBounds largeBounds = searchBounds(region, LARGE);\n\n'
              '        List<ChunkEvaluation> evaluated = new ArrayList<>(sampledChunks.size());',
              '        SearchBounds smallBounds = searchBounds(region, SMALL);\n'
              '        SearchBounds largeBounds = searchBounds(region, LARGE);\n'
              '        Map<Long, SurfaceSample> surfaceCache = new HashMap<>();\n'
              '        Set<Long> missingSurfaceSamples = new HashSet<>();\n\n'
              '        List<ChunkEvaluation> evaluated = new ArrayList<>(sampledChunks.size());'
          )
          replace_once(
              '            Site small = evaluateSiteInChunk(level, chunk, SMALL, smallBounds, false);\n'
              '            Site large = hasLarge ? evaluateSiteInChunk(level, chunk, LARGE, largeBounds, false) : null;',
              '            Site small = evaluateSiteInChunk(level, chunk, SMALL, smallBounds, false, surfaceCache, missingSurfaceSamples);\n'
              '            Site large = hasLarge ? evaluateSiteInChunk(level, chunk, LARGE, largeBounds, false, surfaceCache, missingSurfaceSamples) : null;'
          )
          replace_once(
              '            Site refined = findBestSiteInChunk(level, candidate.chunk(), size, bounds, true);',
              '            Site refined = findBestSiteInChunk(level, candidate.chunk(), size, bounds, true, surfaceCache, missingSurfaceSamples);'
          )
          replace_once(
              '            SearchBounds bounds,\n'
              '            boolean exhaustive\n'
              '    ) {\n'
              '        Site site = findBestSiteInChunk(level, chunk, size, bounds, exhaustive);',
              '            SearchBounds bounds,\n'
              '            boolean exhaustive,\n'
              '            Map<Long, SurfaceSample> surfaceCache,\n'
              '            Set<Long> missingSurfaceSamples\n'
              '    ) {\n'
              '        Site site = findBestSiteInChunk(level, chunk, size, bounds, exhaustive, surfaceCache, missingSurfaceSamples);'
          )
          replace_once(
              '            SearchBounds bounds,\n'
              '            boolean exhaustive\n'
              '    ) {\n'
              '        int chunkMinX = chunk.chunkX() << 4;',
              '            SearchBounds bounds,\n'
              '            boolean exhaustive,\n'
              '            Map<Long, SurfaceSample> surfaceCache,\n'
              '            Set<Long> missingSurfaceSamples\n'
              '    ) {\n'
              '        int chunkMinX = chunk.chunkX() << 4;'
          )
          replace_once(
              '                    TerrainAssessment terrain = assessTerrain(level, x, z, size, !exhaustive);',
              '                    TerrainAssessment terrain = assessTerrain(level, x, z, size, !exhaustive, surfaceCache, missingSurfaceSamples);'
          )
          replace_once(
              '    private static TerrainAssessment assessTerrain(ServerLevel level, int centerX, int centerZ, TemplateSize size, boolean sampled) {',
              '    private static TerrainAssessment assessTerrain(\n'
              '            ServerLevel level, int centerX, int centerZ, TemplateSize size, boolean sampled,\n'
              '            Map<Long, SurfaceSample> surfaceCache, Set<Long> missingSurfaceSamples\n'
              '    ) {'
          )
          text = text.replace(
              '                    SurfaceSample sample = findSurfaceSample(level, originX + dx, originZ + dz);',
              '                    SurfaceSample sample = findSurfaceSample(level, originX + dx, originZ + dz, surfaceCache, missingSurfaceSamples);'
          )
          if text.count('findSurfaceSample(level, originX + dx, originZ + dz, surfaceCache, missingSurfaceSamples)') != 2:
              raise SystemExit('Expected two cached footprint sample calls')
          replace_once(
              '    private static SurfaceSample findSurfaceSample(ServerLevel level, int x, int z) {\n'
              '        int top = level.getHeight(Heightmap.Types.WORLD_SURFACE, x, z) - 1;',
              '    private static SurfaceSample findSurfaceSample(\n'
              '            ServerLevel level, int x, int z, Map<Long, SurfaceSample> surfaceCache, Set<Long> missingSurfaceSamples\n'
              '    ) {\n'
              '        long key = coordinateKey(x, z);\n'
              '        SurfaceSample cached = surfaceCache.get(key);\n'
              '        if (cached != null) return cached;\n'
              '        if (missingSurfaceSamples.contains(key)) return null;\n\n'
              '        SurfaceSample sample = readSurfaceSample(level, x, z);\n'
              '        if (sample == null) missingSurfaceSamples.add(key);\n'
              '        else surfaceCache.put(key, sample);\n'
              '        return sample;\n'
              '    }\n\n'
              '    private static SurfaceSample readSurfaceSample(ServerLevel level, int x, int z) {\n'
              '        int top = level.getHeight(Heightmap.Types.WORLD_SURFACE, x, z) - 1;'
          )
          replace_once(
              '    private static long chunkKey(int x, int z) {\n'
              '        return ((long) x << 32) ^ (z & 0xffffffffL);\n'
              '    }',
              '    private static long chunkKey(int x, int z) {\n'
              '        return coordinateKey(x, z);\n'
              '    }\n\n'
              '    private static long coordinateKey(int x, int z) {\n'
              '        return ((long) x << 32) ^ (z & 0xffffffffL);\n'
              '    }'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-basecamp-surface-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/net/njw/aftertheend/city/basecamp/BasecampPlacementPlanner.java .github/workflows/apply-basecamp-surface-cache.yml
          git commit -m "perf: cache basecamp surface samples"
          git push origin HEAD:main
