name: Intensify Basecamp Ruins

on:
  push:
    paths:
      - ".github/workflows/intensify-basecamp-ruins.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Intensify ruin generators
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          large_path = Path("tools/generate_basecamp_structure.py")
          large = large_path.read_text()
          large_func = '''def add_ruin_decay(cfg):
              if cfg["aged_level"] < 2: return

              # Ruined variants deliberately lose contiguous sections instead of
              # merely swapping materials. The altar should remain recognizable,
              # but its circles, approaches, and obelisks must no longer read as pristine.
              missing = [
                  # Central altar: broad breaks through the raised stair ring.
                  (11, 1, 6), (12, 1, 6), (13, 1, 6), (14, 1, 6),
                  (20, 1, 11), (20, 1, 12), (20, 1, 13), (20, 1, 14),
                  (16, 1, 19), (15, 1, 20), (14, 1, 20), (13, 1, 20),
                  (6, 1, 14), (6, 1, 13), (6, 1, 12),

                  # Central magic floor: several chunks of the glazed circle itself are gone.
                  (11, 2, 7), (12, 2, 7), (13, 2, 7), (14, 2, 7), (15, 2, 7),
                  (19, 2, 11), (19, 2, 12), (19, 2, 13), (19, 2, 14),
                  (17, 2, 18), (16, 2, 18), (15, 2, 19), (14, 2, 19),
                  (8, 2, 17), (7, 2, 14), (7, 2, 13),

                  # Outer circular platform: break both the upper rim and lower footprint.
                  (12, 1, 3), (13, 1, 3), (14, 1, 3),
                  (23, 1, 12), (23, 1, 13), (23, 1, 14),
                  (15, 1, 23), (14, 1, 23), (13, 1, 23),
                  (3, 1, 15), (3, 1, 14),
                  (10, 0, 3), (11, 0, 3), (12, 0, 3),
                  (23, 0, 11), (23, 0, 12), (23, 0, 13),
                  (16, 0, 23), (15, 0, 23), (3, 0, 15), (3, 0, 14),

                  # Worn approaches: not all four entrances survive intact.
                  (12, 1, 1), (14, 1, 1),
                  (12, 1, 25), (13, 1, 25),
                  (1, 1, 12), (1, 1, 13),
                  (25, 1, 14),

                  # Obelisks: asymmetric height loss and missing decorative pieces.
                  (4, 7, 4), (4, 6, 4), (4, 5, 4), (5, 4, 4),
                  (22, 7, 4), (22, 6, 4), (21, 4, 4),
                  (4, 7, 22), (4, 4, 21),
                  (22, 7, 22), (22, 6, 22), (22, 5, 22), (22, 4, 21),
                  (21, 2, 4),
              ]
              for pos in missing:
                  blocks.pop(pos, None)

              # Cracked masonry clusters around fracture edges, making the transition
              # between intact stone and empty space visually explicit.
              cracked = [
                  (10, 2, 8), (11, 2, 8), (16, 2, 8), (18, 2, 10),
                  (18, 2, 15), (17, 2, 17), (13, 2, 18), (9, 2, 16),
                  (8, 2, 15), (8, 2, 12),
                  (10, 1, 6), (15, 1, 6), (19, 1, 10), (20, 1, 15),
                  (17, 1, 18), (12, 1, 19), (7, 1, 15), (7, 1, 11),
                  (11, 1, 4), (15, 1, 4), (22, 1, 11), (22, 1, 15),
                  (16, 1, 22), (12, 1, 22), (4, 1, 16), (4, 1, 13),
                  (3, 1, 4), (4, 2, 3), (5, 3, 4),
                  (21, 1, 4), (22, 2, 5), (21, 3, 4),
                  (3, 2, 22), (4, 3, 21), (21, 1, 22), (22, 2, 21),
              ]
              for pos in cracked:
                  if pos in blocks: put(*pos, cfg["aged"])

              # Moss stays clustered instead of uniformly coating the ruin.
              mossy = [
                  (9, 1, 5), (8, 1, 6), (7, 1, 9), (6, 1, 10),
                  (5, 1, 18), (6, 1, 19), (8, 1, 21), (9, 1, 21),
                  (3, 1, 5), (3, 2, 4), (4, 3, 3),
                  (20, 1, 21), (21, 1, 21), (22, 1, 20), (23, 2, 22),
                  (18, 1, 7), (19, 1, 8),
              ]
              for pos in mossy:
                  if pos in blocks: put(*pos, cfg["moss"])

              # Cobwebs occupy cavities and broken ledges but do not fill every gap.
              webs = [
                  (12, 3, 7), (14, 3, 7), (19, 3, 12), (19, 3, 14),
                  (16, 3, 18), (8, 3, 16),
                  (4, 6, 4), (5, 4, 5), (22, 6, 4), (21, 4, 5),
                  (5, 4, 21), (21, 4, 21), (22, 6, 22),
              ]
              for pos in webs:
                  if pos not in blocks: put(*pos, "minecraft:cobweb")
          '''
          large_func = "\n".join(line[10:] if line.startswith("          ") else line for line in large_func.splitlines()) + "\n\n"
          large, count = re.subn(r"def add_ruin_decay\(cfg\):.*?(?=def generate\()", large_func, large, flags=re.S)
          assert count == 1, f"large ruin function matches: {count}"
          large_path.write_text(large)

          small_path = Path("tools/generate_small_basecamp_structure.py")
          small = small_path.read_text()
          small_func = '''def add_ruin_decay(cfg):
              if not cfg["decayed"]: return

              # At 11x11 every missing block matters, so use a few deliberate
              # contiguous bites rather than sparse single-block damage.
              missing = [
                  # Raised magic floor: open three obvious gaps in the circle.
                  (4, 2, 2), (5, 2, 2), (6, 2, 2),
                  (8, 2, 4), (8, 2, 5), (8, 2, 6),
                  (6, 2, 8), (5, 2, 8), (3, 2, 7),

                  # Main platform and approaches: chipped footprint, not just surface weathering.
                  (4, 1, 1), (5, 1, 1), (6, 1, 1),
                  (9, 1, 4), (9, 1, 5), (9, 1, 6),
                  (5, 1, 9), (6, 1, 9), (2, 1, 7),
                  (3, 0, 1), (4, 0, 1), (5, 0, 1),
                  (9, 0, 4), (9, 0, 5), (9, 0, 6),

                  # Short obelisks with visibly different surviving heights.
                  (1, 5, 1), (1, 4, 1),
                  (9, 5, 1),
                  (1, 5, 9),
                  (9, 5, 9), (9, 4, 9),
              ]
              for pos in missing: blocks.pop(pos, None)

              cracked = [
                  (3, 2, 3), (7, 2, 3), (7, 2, 4), (7, 2, 7),
                  (4, 2, 7), (3, 2, 6),
                  (3, 1, 2), (7, 1, 2), (8, 1, 3), (8, 1, 7),
                  (7, 1, 8), (4, 1, 8), (2, 1, 6),
                  (1, 3, 1), (2, 1, 1), (9, 3, 1),
                  (1, 3, 9), (8, 1, 9), (9, 3, 9),
              ]
              for pos in cracked:
                  if pos in blocks: put(*pos, cfg["aged"])

              mossy = [
                  (2, 1, 2), (3, 1, 2), (2, 1, 8), (3, 1, 8),
                  (8, 1, 8), (7, 1, 8), (1, 2, 9), (8, 1, 2),
              ]
              for pos in mossy:
                  if pos in blocks: put(*pos, cfg["moss"])

              webs = [
                  (1, 4, 1), (2, 3, 1), (9, 4, 1),
                  (1, 4, 9), (8, 3, 9), (9, 4, 9),
                  (5, 3, 2), (8, 3, 5), (5, 3, 8),
              ]
              for pos in webs:
                  if pos not in blocks: put(*pos, "minecraft:cobweb")
          '''
          small_func = "\n".join(line[10:] if line.startswith("          ") else line for line in small_func.splitlines()) + "\n\n"
          small, count = re.subn(r"def add_ruin_decay\(cfg\):.*?(?=TAG_END,)", small_func, small, flags=re.S)
          assert count == 1, f"small ruin function matches: {count}"
          small_path.write_text(small)
          PY

      - name: Generate structures
        run: |
          python tools/generate_basecamp_structure.py
          python tools/generate_small_basecamp_structure.py

      - name: Validate stronger ruin contrast
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import gzip

          def capture(path):
              spec = importlib.util.spec_from_file_location("generator", path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              counts = {}
              mod.write_structure = lambda name: counts.__setitem__(name, len(mod.blocks))
              mod.main()
              return counts

          large = capture("tools/generate_basecamp_structure.py")
          small = capture("tools/generate_small_basecamp_structure.py")
          large_pairs = [
              ("basecamp_01", "basecamp_01_ruined"),
              ("basecamp_mossy_clean", "basecamp_mossy"),
              ("basecamp_cyan", "basecamp_cyan_ruined"),
              ("basecamp_green", "basecamp_green_ruined"),
              ("basecamp_white", "basecamp_white_ruined"),
          ]
          small_pairs = [
              ("basecamp_small_01", "basecamp_small_01_ruined"),
              ("basecamp_small_mossy_clean", "basecamp_small_mossy"),
              ("basecamp_small_cyan", "basecamp_small_cyan_ruined"),
              ("basecamp_small_green", "basecamp_small_green_ruined"),
              ("basecamp_small_white", "basecamp_small_white_ruined"),
          ]
          for clean, ruined in large_pairs:
              diff = large[clean] - large[ruined]
              assert diff >= 45, (clean, ruined, large[clean], large[ruined], diff)
          for clean, ruined in small_pairs:
              diff = small[clean] - small[ruined]
              assert diff >= 18, (clean, ruined, small[clean], small[ruined], diff)

          root = Path("src/main/resources/data/njw_after_the_end/structure/basecamp")
          for _, ruined in large_pairs + small_pairs:
              with gzip.open(root / f"{ruined}.nbt", "rb") as f:
                  raw = f.read()
              for token in (b"cracked_stone_bricks", b"mossy_stone_bricks", b"cobweb"):
                  assert token in raw, (ruined, token)
          print("Validated stronger ruin silhouettes for all ten ruined variants")
          PY

      - name: Commit stronger ruins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_basecamp_structure.py tools/generate_small_basecamp_structure.py
          git add src/main/resources/data/njw_after_the_end/structure/basecamp/*.nbt
          git rm .github/workflows/intensify-basecamp-ruins.yml
          git commit -m "feat: intensify basecamp ruin damage"
          git push
