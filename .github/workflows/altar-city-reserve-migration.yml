name: Altar City Reserve Migration

on:
  push:
    branches:
      - tmp/altar-city-reserve

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply migration
        run: python tools/migrate_altar_city_reserve.py
      - name: Regenerate renamed altar templates
        run: |
          python tools/generate_altar_structure.py
          python tools/generate_small_altar_structure.py
      - name: Audit legacy terminology
        shell: bash
        run: |
          if grep -RniE 'base[ _-]*camp' . \
              --exclude-dir=.git \
              --exclude='migrate_altar_city_reserve.py' \
              --exclude='altar-city-reserve-migration.yml'; then
            echo 'Legacy Basecamp terminology remains.'
            exit 1
          fi
      - name: Build
        run: ./gradlew build
      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add locked city reserve and rename altars'
          git push origin HEAD:tmp/altar-city-reserve
